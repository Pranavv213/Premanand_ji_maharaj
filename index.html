<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shri Premanand Ji Maharaj Chat AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #0f0715 0%, #1a0b2e 50%, #2d0b1e 100%);
      --glass-bg: rgba(255, 255, 255, 0.03);
      --glass-border: rgba(255, 215, 0, 0.18);
      --glass-glow: 0 8px 32px 0 rgba(255, 153, 51, 0.15);
      
      --gold-primary: #ffd700;
      --gold-gradient: linear-gradient(135deg, #ffe066 0%, #f5a623 50%, #e65c00 100%);
      --radha-pink: #ff2a85;
      --radha-pink-glow: rgba(255, 42, 133, 0.35);
      --saffron: #ff9933;
      
      --text-main: #f8f9fa;
      --text-muted: #a0a5ba;
      --user-msg-bg: linear-gradient(135deg, #800020 0%, #4a0011 100%);
      --bot-msg-bg: rgba(255, 255, 255, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Outfit', -apple-system, sans-serif;
    }

    body {
      background: var(--bg-gradient);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      color: var(--text-main);
      overflow: hidden;
      position: relative;
    }

    body::before {
      content: '';
      position: absolute;
      width: 300px;
      height: 300px;
      background: var(--radha-pink);
      filter: blur(140px);
      border-radius: 50%;
      top: 10%;
      left: 15%;
      z-index: 0;
      opacity: 0.25;
    }

    body::after {
      content: '';
      position: absolute;
      width: 350px;
      height: 350px;
      background: var(--saffron);
      filter: blur(150px);
      border-radius: 50%;
      bottom: 10%;
      right: 15%;
      z-index: 0;
      opacity: 0.2;
    }

    .chat-container {
      width: 100%;
      max-width: 680px;
      height: 90vh;
      background: var(--glass-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      box-shadow: var(--glass-glow), inset 0 0 15px rgba(255, 215, 0, 0.05);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      z-index: 1;
      position: relative;
    }

    .chat-header {
      background: rgba(20, 8, 25, 0.7);
      padding: 18px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--glass-border);
    }

    .header-avatar-container {
      position: relative;
    }

    .header-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--gold-primary);
      box-shadow: 0 0 12px var(--radha-pink-glow);
    }

    .ai-badge-dot {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 12px;
      height: 12px;
      background: #00ff88;
      border: 2px solid #0f0715;
      border-radius: 50%;
      box-shadow: 0 0 8px #00ff88;
    }

    .header-info h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.25rem;
      background: var(--gold-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: 0.5px;
    }

    .header-info p {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chat-messages {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .chat-messages::-webkit-scrollbar {
      width: 6px;
    }

    .chat-messages::-webkit-scrollbar-thumb {
      background: rgba(255, 215, 0, 0.2);
      border-radius: 10px;
    }

    .message-row {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      max-width: 85%;
    }

    .message-row.user {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message-row.assistant {
      align-self: flex-start;
    }

    .bot-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
      border: 1.5px solid var(--gold-primary);
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.2);
    }

    .message {
      padding: 14px 18px;
      border-radius: 18px;
      font-size: 0.95rem;
      line-height: 1.6;
      word-wrap: break-word;
      white-space: pre-wrap;
      position: relative;
    }

    .message-row.user .message {
      background: var(--user-msg-bg);
      color: #ffffff;
      border: 1px solid rgba(255, 42, 133, 0.3);
      border-bottom-right-radius: 4px;
      box-shadow: 0 4px 15px rgba(128, 0, 32, 0.4);
    }

    .message-row.assistant .message {
      background: var(--bot-msg-bg);
      color: var(--text-main);
      border: 1px solid var(--glass-border);
      border-bottom-left-radius: 4px;
      backdrop-filter: blur(10px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    /* Animated Loading Component */
    .loading-row {
      align-self: flex-start;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .loading-container {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 18px;
      background: rgba(255, 215, 0, 0.05);
      border-radius: 18px;
      border: 1px solid var(--glass-border);
      border-bottom-left-radius: 4px;
      box-shadow: var(--glass-glow);
    }

    .loading-dots {
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .loading-dots span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--gold-primary);
      box-shadow: 0 0 8px var(--gold-primary);
      animation: pulseGlow 1.4s infinite ease-in-out both;
    }

    .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
    .loading-dots span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes pulseGlow {
      0%, 80%, 100% {
        transform: scale(0.6);
        opacity: 0.3;
      }
      40% {
        transform: scale(1.2);
        opacity: 1;
        background: var(--radha-pink);
        box-shadow: 0 0 10px var(--radha-pink);
      }
    }

    .loading-text {
      font-size: 0.85rem;
      color: var(--gold-primary);
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .chat-input-area {
      display: flex;
      padding: 18px;
      background: rgba(15, 7, 21, 0.8);
      border-top: 1px solid var(--glass-border);
      gap: 12px;
      align-items: center;
    }

    .chat-input-area input {
      flex: 1;
      padding: 14px 20px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      outline: none;
      font-size: 0.95rem;
      color: var(--text-main);
      transition: all 0.3s ease;
    }

    .chat-input-area input::placeholder {
      color: var(--text-muted);
    }

    .chat-input-area input:focus {
      border-color: var(--gold-primary);
      box-shadow: 0 0 12px rgba(255, 215, 0, 0.2);
      background: rgba(255, 255, 255, 0.08);
    }

    .chat-input-area button {
      padding: 14px 24px;
      background: var(--gold-gradient);
      color: #0f0715;
      border: none;
      border-radius: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(245, 166, 35, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .chat-input-area button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 42, 133, 0.4);
    }

    .chat-input-area button:disabled {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      cursor: not-allowed;
      box-shadow: none;
      transform: none;
    }
  </style>
</head>
<body>

  <div class="chat-container">
    <div class="chat-header">
      <div class="header-avatar-container">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSWCNZpuQTOcutmN-KQ5-bPFGujKHGQmosWX3izwLycdggSLeFtWIrWj9o&s=10" alt="Avatar" class="header-avatar" />
        <span class="ai-badge-dot"></span>
      </div>
      <div class="header-info">
        <h2>प्रेम मार्ग AI</h2>
        <p>मार्गदर्शन: महाराज जी का भाव</p>
      </div>
    </div>

    <div class="chat-messages" id="chatMessages">
      <div class="message-row assistant">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSWCNZpuQTOcutmN-KQ5-bPFGujKHGQmosWX3izwLycdggSLeFtWIrWj9o&s=10" class="bot-avatar" alt="Bot Avatar" />
        <div class="message">राधे-राधे, Ask your queries to Shri Premand Ji Maharaj!</div>
      </div>
    </div>

    <form class="chat-input-area" id="chatForm">
      <input 
        type="text" 
        id="userInput" 
        placeholder="प्रश्न पूछें..." 
        autocomplete="off"
        required
      />
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </div>

  <script>
    const API_URL = "http://127.0.0.1:8000/chat";
    const AVATAR_URL = "https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSWCNZpuQTOcutmN-KQ5-bPFGujKHGQmosWX3izwLycdggSLeFtWIrWj9o&s=10";

    const chatMessages = document.getElementById("chatMessages");
    const chatForm = document.getElementById("chatForm");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");

    function appendMessage(text, sender) {
      if (sender === "loading") {
        const loadingRow = document.createElement("div");
        loadingRow.classList.add("loading-row");
        loadingRow.id = "loadingIndicator";

        const img = document.createElement("img");
        img.src = AVATAR_URL;
        img.classList.add("bot-avatar");
        img.alt = "Bot Avatar";

        const loadingContainer = document.createElement("div");
        loadingContainer.classList.add("loading-container");

        const dotsDiv = document.createElement("div");
        dotsDiv.classList.add("loading-dots");
        dotsDiv.innerHTML = "<span></span><span></span><span></span>";

        const textDiv = document.createElement("div");
        textDiv.classList.add("loading-text");
        textDiv.textContent = text;

        loadingContainer.appendChild(dotsDiv);
        loadingContainer.appendChild(textDiv);
        loadingRow.appendChild(img);
        loadingRow.appendChild(loadingContainer);

        chatMessages.appendChild(loadingRow);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return loadingRow;
      }

      const rowDiv = document.createElement("div");
      rowDiv.classList.add("message-row", sender);

      if (sender === "assistant") {
        const img = document.createElement("img");
        img.src = AVATAR_URL;
        img.classList.add("bot-avatar");
        img.alt = "Bot Avatar";
        rowDiv.appendChild(img);
      }

      const messageDiv = document.createElement("div");
      messageDiv.classList.add("message");
      messageDiv.textContent = text;

      rowDiv.appendChild(messageDiv);
      chatMessages.appendChild(rowDiv);
      chatMessages.scrollTop = chatMessages.scrollHeight;
      return rowDiv;
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const query = userInput.value.trim();
      if (!query) return;

      appendMessage(query, "user");
      userInput.value = "";
      userInput.disabled = true;
      sendBtn.disabled = true;

      const loadingDiv = appendMessage("Loading...", "loading");

      try {
        const response = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            query: query,
            top_k: 3
          })
        });

        if (!response.ok) {
          throw new Error(`Server status: ${response.status}`);
        }

        const data = await response.json();

        if (loadingDiv && loadingDiv.parentNode) {
          chatMessages.removeChild(loadingDiv);
        }

        appendMessage(data.answer, "assistant");

      } catch (error) {
        console.error("API Error:", error);
        if (loadingDiv && loadingDiv.parentNode) {
          chatMessages.removeChild(loadingDiv);
        }
        appendMessage("त्रुटि: उत्तर प्राप्त करने में समस्या हुई।", "assistant");
      } finally {
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    });
  </script>

</body>
</html>
